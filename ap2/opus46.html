<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚡ AutomatisierungsProfi – IHK AP2 Trainer</title>
<style>
:root {
  --green: #58CC02; --green-dark: #46a302; --blue: #1CB0F6; --blue-dark: #1899d6;
  --red: #FF4B4B; --red-dark: #ea2b2b; --gold: #FFC800; --orange: #FF9600;
  --purple: #CE82FF; --pink: #FF86D0;
  --bg: #131F24; --bg2: #1a2b32; --bg3: #223742; --bg4: #2b4450;
  --text: #FFFFFF; --text2: #afafaf; --text3: #7a8b95;
  --card: #1e3040; --card-hover: #243d4f;
  --correct-bg: #1a3a1a; --wrong-bg: #3a1a1a;
  --radius: 16px; --radius-sm: 12px;
  --transition: all 0.3s cubic-bezier(0.4,0,0.2,1);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; overflow-x: hidden;
}
.hidden { display:none !important; }

/* Top Bar */
.topbar {
  position: sticky; top:0; z-index:100;
  background: var(--bg2); border-bottom: 2px solid var(--bg3);
  padding: 12px 20px; display:flex; align-items:center; justify-content:space-between;
  backdrop-filter: blur(10px);
}
.topbar-left { display:flex; align-items:center; gap:8px; }
.topbar-logo { font-size:24px; font-weight:800; color:var(--green); cursor:pointer; }
.topbar-stats { display:flex; gap:16px; align-items:center; }
.stat { display:flex; align-items:center; gap:5px; font-weight:700; font-size:15px; }
.stat-icon { font-size:20px; }
.stat.xp { color: var(--gold); }
.stat.streak { color: var(--orange); }
.stat.hearts { color: var(--red); }
.stat.level { color: var(--blue); }

/* Screens */
.screen { max-width:700px; margin:0 auto; padding:20px; }

/* Home Screen - Skill Tree */
.skill-tree { display:flex; flex-direction:column; gap:0; align-items:center; padding:30px 20px; }
.module-group { width:100%; max-width:400px; margin-bottom:8px; position:relative; }
.module-header {
  text-align:center; padding:16px 24px; border-radius:var(--radius);
  font-weight:800; font-size:14px; text-transform:uppercase; letter-spacing:2px;
  margin-bottom:16px; color: #fff; position:relative;
}
.module-connector {
  width:4px; height:20px; background:var(--bg3); margin:0 auto;
}

.lesson-node-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:6px; position:relative; }
.lesson-node-wrap::before {
  content:''; position:absolute; top:-6px; left:50%; width:4px; height:6px;
  background: var(--bg3); transform:translateX(-50%);
}
.lesson-node-wrap:first-child::before { display:none; }

.lesson-node {
  width:72px; height:72px; border-radius:50%; display:flex; align-items:center;
  justify-content:center; font-size:28px; cursor:pointer;
  border:4px solid transparent; transition: var(--transition);
  position:relative; background: var(--bg3);
}
.lesson-node.available {
  background: var(--green); border-color: var(--green-dark);
  box-shadow: 0 6px 0 var(--green-dark), 0 8px 20px rgba(88,204,2,0.3);
  transform: translateY(-3px);
}
.lesson-node.available:hover {
  transform: translateY(-5px); box-shadow: 0 8px 0 var(--green-dark), 0 10px 30px rgba(88,204,2,0.4);
}
.lesson-node.available:active { transform: translateY(0); box-shadow: 0 2px 0 var(--green-dark); }
.lesson-node.completed {
  background: var(--gold); border-color: #d4a600;
  box-shadow: 0 4px 0 #d4a600;
}
.lesson-node.locked {
  background: var(--bg3); border-color: var(--bg4); opacity:0.5; cursor:not-allowed;
}
.lesson-node .crown { position:absolute; top:-14px; font-size:18px; }
.lesson-title {
  font-size:12px; color:var(--text2); text-align:center; margin-top:6px;
  max-width:140px; font-weight:600;
}
.lesson-node.available .lesson-title { color:var(--text); }

/* Lesson Start Modal */
.modal-overlay {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:200;
  background:rgba(0,0,0,0.7); display:flex; align-items:center; justify-content:center;
  animation: fadeIn 0.2s;
}
.modal {
  background:var(--bg2); border-radius:var(--radius); padding:32px; max-width:380px;
  width:90%; text-align:center; animation: scaleIn 0.3s;
  border: 2px solid var(--bg3);
}
.modal h2 { margin-bottom:8px; font-size:22px; }
.modal p { color:var(--text2); margin-bottom:24px; font-size:15px; }
.modal-icon { font-size:48px; margin-bottom:16px; display:block; }

/* Buttons */
.btn {
  padding:14px 32px; border-radius:var(--radius-sm); border:none; font-size:16px;
  font-weight:700; cursor:pointer; transition:var(--transition); display:inline-block;
  text-transform:uppercase; letter-spacing:1px;
}
.btn-primary {
  background:var(--green); color:#fff;
  box-shadow: 0 4px 0 var(--green-dark);
}
.btn-primary:hover { background:#62e002; transform:translateY(-2px); box-shadow:0 6px 0 var(--green-dark); }
.btn-primary:active { transform:translateY(2px); box-shadow:0 1px 0 var(--green-dark); }
.btn-secondary {
  background:var(--bg3); color:var(--text);
  box-shadow: 0 4px 0 var(--bg4);
}
.btn-secondary:hover { background:var(--bg4); }
.btn-blue { background:var(--blue); box-shadow:0 4px 0 var(--blue-dark); color:#fff; }
.btn-blue:hover { background:#2dc0ff; }
.btn-blue:active { transform:translateY(2px); box-shadow:0 1px 0 var(--blue-dark); }
.btn-block { width:100%; display:block; }
.btn-sm { padding:10px 20px; font-size:14px; }

/* Quiz Screen */
.quiz-header {
  display:flex; align-items:center; gap:16px; margin-bottom:32px; padding-top:8px;
}
.quiz-close { font-size:24px; cursor:pointer; color:var(--text3); background:none; border:none; }
.quiz-close:hover { color:var(--text); }
.progress-bar-wrap {
  flex:1; height:16px; background:var(--bg3); border-radius:10px; overflow:hidden;
}
.progress-bar-fill {
  height:100%; background:var(--green); border-radius:10px;
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
}
.quiz-hearts { display:flex; gap:4px; font-size:20px; }
.quiz-content { animation: slideUp 0.4s; }
.quiz-question {
  font-size:22px; font-weight:700; margin-bottom:28px; line-height:1.4;
}
.quiz-hint {
  background:var(--bg3); padding:14px 18px; border-radius:var(--radius-sm);
  margin-bottom:24px; font-size:14px; color:var(--text2); border-left:4px solid var(--blue);
}
.quiz-options { display:flex; flex-direction:column; gap:12px; margin-bottom:24px; }
.quiz-option {
  padding:16px 20px; border-radius:var(--radius-sm); border:2px solid var(--bg3);
  background:var(--bg2); cursor:pointer; font-size:16px; transition:var(--transition);
  display:flex; align-items:center; gap:12px; text-align:left;
}
.quiz-option:hover { border-color:var(--blue); background:var(--card); }
.quiz-option.selected { border-color:var(--blue); background:rgba(28,176,246,0.1); }
.quiz-option.correct { border-color:var(--green); background:var(--correct-bg); }
.quiz-option.wrong { border-color:var(--red); background:var(--wrong-bg); }
.quiz-option-letter {
  width:32px; height:32px; border-radius:8px; border:2px solid var(--bg4);
  display:flex; align-items:center; justify-content:center; font-weight:700;
  font-size:14px; flex-shrink:0;
}
.quiz-option.selected .quiz-option-letter { border-color:var(--blue); color:var(--blue); }
.quiz-option.correct .quiz-option-letter { border-color:var(--green); color:var(--green); background:rgba(88,204,2,0.2); }
.quiz-option.wrong .quiz-option-letter { border-color:var(--red); color:var(--red); background:rgba(255,75,75,0.2); }

.quiz-input {
  width:100%; padding:16px 20px; border-radius:var(--radius-sm); border:2px solid var(--bg3);
  background:var(--bg2); color:var(--text); font-size:18px; outline:none;
  transition:var(--transition); margin-bottom:24px;
}
.quiz-input:focus { border-color:var(--blue); }
.quiz-input.correct { border-color:var(--green); background:var(--correct-bg); }
.quiz-input.wrong { border-color:var(--red); background:var(--wrong-bg); }

/* Feedback */
.feedback-bar {
  position:fixed; bottom:0; left:0; right:0; padding:20px 24px;
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  z-index:50; animation: slideFromBottom 0.3s;
}
.feedback-bar.correct { background: #1a3a1a; border-top:2px solid var(--green); }
.feedback-bar.wrong { background: #3a1a1a; border-top:2px solid var(--red); }
.feedback-content { display:flex; align-items:center; gap:12px; flex:1; }
.feedback-icon { font-size:32px; }
.feedback-text h3 { font-size:16px; margin-bottom:2px; }
.feedback-text p { font-size:13px; color:var(--text2); }
.feedback-bar.correct h3 { color:var(--green); }
.feedback-bar.wrong h3 { color:var(--red); }

/* Results Screen */
.results {
  text-align:center; padding:40px 20px; animation:scaleIn 0.5s;
}
.results-icon { font-size:80px; margin-bottom:16px; display:block; }
.results h1 { font-size:28px; margin-bottom:8px; }
.results-subtitle { color:var(--text2); font-size:16px; margin-bottom:32px; }
.results-stats {
  display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:32px;
}
.results-stat {
  background:var(--bg2); border-radius:var(--radius-sm); padding:20px 16px;
  border:2px solid var(--bg3);
}
.results-stat-value { font-size:28px; font-weight:800; display:block; }
.results-stat-label { font-size:12px; color:var(--text2); text-transform:uppercase; margin-top:4px; }
.results-stat.xp .results-stat-value { color:var(--gold); }
.results-stat.acc .results-stat-value { color:var(--green); }
.results-stat.time .results-stat-value { color:var(--blue); }

/* XP Popup */
.xp-popup {
  position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:48px; font-weight:900; color:var(--gold); z-index:999;
  pointer-events:none; animation: xpPop 1s forwards;
  text-shadow: 0 0 30px rgba(255,200,0,0.5);
}

/* Profile */
.profile-card {
  background:var(--bg2); border-radius:var(--radius); padding:32px;
  text-align:center; margin-bottom:20px; border:2px solid var(--bg3);
}
.profile-avatar { font-size:64px; margin-bottom:12px; display:block; }
.profile-level {
  display:inline-block; padding:6px 16px; border-radius:20px;
  background:var(--blue); font-weight:700; font-size:14px; margin-bottom:12px;
}
.profile-xp-bar {
  height:12px; background:var(--bg3); border-radius:8px; overflow:hidden; margin:12px 0;
}
.profile-xp-fill { height:100%; background:var(--gold); border-radius:8px; transition:width 0.5s; }

.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px; }
.stat-card {
  background:var(--bg2); border-radius:var(--radius-sm); padding:20px;
  border:2px solid var(--bg3); text-align:center;
}
.stat-card-icon { font-size:28px; margin-bottom:8px; display:block; }
.stat-card-value { font-size:24px; font-weight:800; display:block; }
.stat-card-label { font-size:12px; color:var(--text2); text-transform:uppercase; }

/* Daily Goal */
.daily-goal {
  background: linear-gradient(135deg, var(--bg2), var(--bg3));
  border-radius:var(--radius); padding:24px; margin-bottom:24px;
  border:2px solid var(--bg3); text-align:center;
}
.daily-goal h3 { margin-bottom:12px; }
.daily-progress { display:flex; gap:6px; justify-content:center; margin-top:12px; }
.daily-dot {
  width:36px; height:36px; border-radius:50%; background:var(--bg4);
  display:flex; align-items:center; justify-content:center; font-size:16px;
}
.daily-dot.done { background:var(--green); }

/* Nav */
.bottom-nav {
  position:fixed; bottom:0; left:0; right:0; background:var(--bg2);
  border-top:2px solid var(--bg3); display:flex; z-index:100; padding:4px 0;
}
.nav-item {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:2px;
  padding:10px 0; cursor:pointer; color:var(--text3); transition:var(--transition);
  background:none; border:none; font-size:11px; font-weight:700;
}
.nav-item:hover, .nav-item.active { color:var(--blue); }
.nav-item .nav-icon { font-size:24px; }
.nav-item.active .nav-icon { transform:scale(1.1); }

/* Scrollbar */
::-webkit-scrollbar { width:8px; }
::-webkit-scrollbar-track { background:var(--bg); }
::-webkit-scrollbar-thumb { background:var(--bg3); border-radius:4px; }

/* Animations */
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes scaleIn { from{opacity:0;transform:scale(0.9)} to{opacity:1;transform:scale(1)} }
@keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
@keyframes slideFromBottom { from{transform:translateY(100%)} to{transform:translateY(0)} }
@keyframes xpPop { 0%{opacity:1;transform:translate(-50%,-50%) scale(0.5)} 50%{transform:translate(-50%,-50%) scale(1.2)} 100%{opacity:0;transform:translate(-50%,-150%) scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }
@keyframes bounce { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }
@keyframes heartBeat { 0%{transform:scale(1)} 15%{transform:scale(1.3)} 30%{transform:scale(1)} }
.shake { animation: shake 0.5s; }
.bounce { animation: bounce 0.4s; }

/* Responsive */
@media(max-width:500px) {
  .quiz-question { font-size:18px; }
  .results-stats { grid-template-columns:1fr; }
  .topbar-stats { gap:10px; }
  .stat { font-size:13px; }
  .feedback-bar { flex-direction:column; text-align:center; }
}

/* Extra */
.screen { padding-bottom:80px; }
.glow-green { text-shadow:0 0 20px rgba(88,204,2,0.5); }
.module-section-title {
  text-align:center; font-size:18px; font-weight:800; padding:16px 24px;
  color:var(--text); margin:24px 0 4px 0;
  background: linear-gradient(135deg, var(--bg3), var(--bg2));
  border-radius: var(--radius); border:2px solid var(--bg4);
}
.module-section-title .mod-icon { font-size:28px; display:block; margin-bottom:4px; }
.module-section-title .mod-progress { font-size:12px; color:var(--text2); font-weight:600; margin-top:4px; }

.explanation-box {
  background: var(--bg3); border-radius: var(--radius-sm);
  padding: 16px; margin-top: 16px; border-left: 4px solid var(--blue);
}
.explanation-box h4 { color: var(--blue); margin-bottom: 4px; font-size:14px; }
.explanation-box p { font-size: 14px; color: var(--text2); line-height:1.5; }

.tf-options { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:24px; }
.tf-option {
  padding:20px; border-radius:var(--radius-sm); border:2px solid var(--bg3);
  background:var(--bg2); cursor:pointer; font-size:18px; font-weight:700;
  text-align:center; transition:var(--transition);
}
.tf-option:hover { border-color:var(--blue); }
.tf-option.selected { border-color:var(--blue); background:rgba(28,176,246,0.1); }
.tf-option.correct { border-color:var(--green); background:var(--correct-bg); }
.tf-option.wrong { border-color:var(--red); background:var(--wrong-bg); }

.welcome-banner {
  text-align:center; padding:24px; margin-bottom:24px;
  background: linear-gradient(135deg, #1a3520, #132025);
  border-radius: var(--radius); border:2px solid var(--green);
}
.welcome-banner h2 { color:var(--green); font-size:20px; margin-bottom:4px; }
.welcome-banner p { color:var(--text2); font-size:14px; }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar" id="topbar">
  <div class="topbar-left">
    <div class="topbar-logo" onclick="showScreen('home')">⚡ AP2</div>
  </div>
  <div class="topbar-stats">
    <div class="stat streak"><span class="stat-icon">🔥</span><span id="topStreak">0</span></div>
    <div class="stat xp"><span class="stat-icon">⭐</span><span id="topXP">0</span></div>
    <div class="stat hearts"><span class="stat-icon">❤️</span><span id="topHearts">5</span></div>
  </div>
</div>

<!-- Home Screen -->
<div class="screen" id="homeScreen">
  <div class="welcome-banner" id="welcomeBanner">
    <h2>🎯 Willkommen zum AP2-Trainer!</h2>
    <p>Elektroniker für Automatisierungstechnik – IHK Abschlussprüfung Teil 2</p>
  </div>
  <div class="skill-tree" id="skillTree"></div>
</div>

<!-- Quiz Screen -->
<div class="screen hidden" id="quizScreen">
  <div class="quiz-header">
    <button class="quiz-close" onclick="quitQuiz()">✕</button>
    <div class="progress-bar-wrap"><div class="progress-bar-fill" id="quizProgress"></div></div>
    <div class="quiz-hearts" id="quizHearts"></div>
  </div>
  <div class="quiz-content" id="quizContent"></div>
</div>

<!-- Results Screen -->
<div class="screen hidden" id="resultsScreen"></div>

<!-- Profile Screen -->
<div class="screen hidden" id="profileScreen"></div>

<!-- Feedback Bar -->
<div class="feedback-bar hidden" id="feedbackBar">
  <div class="feedback-content">
    <span class="feedback-icon" id="fbIcon"></span>
    <div class="feedback-text">
      <h3 id="fbTitle"></h3>
      <p id="fbText"></p>
    </div>
  </div>
  <button class="btn btn-primary btn-sm" id="fbBtn" onclick="nextQuestion()">WEITER</button>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <span class="modal-icon" id="modalIcon"></span>
    <h2 id="modalTitle"></h2>
    <p id="modalDesc"></p>
    <button class="btn btn-primary btn-block" id="modalBtn">LEKTION STARTEN</button>
    <button class="btn btn-secondary btn-block btn-sm" style="margin-top:10px" onclick="closeModal()">Zurück</button>
  </div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav" id="bottomNav">
  <button class="nav-item active" onclick="showScreen('home')"><span class="nav-icon">🏠</span>Lernen</button>
  <button class="nav-item" onclick="showScreen('profile')"><span class="nav-icon">👤</span>Profil</button>
</div>

<script>
// ============================================================
// QUESTION DATABASE - IHK AP2 Elektroniker Automatisierungstechnik
// ============================================================
const MODULES = [
{
  id:1, title:"Elektrotechnische Grundlagen", icon:"⚡", color:"#58CC02",
  lessons:[
  {
    id:101, title:"Ohmsches Gesetz & Grundgrößen",
    questions:[
      {type:"mc",q:"Wie lautet das Ohmsche Gesetz?",o:["U = R · I","U = R / I","U = I / R","U = R + I"],c:0,
       e:"Das Ohmsche Gesetz lautet U = R · I. Die Spannung (U) ist das Produkt aus Widerstand (R) und Stromstärke (I)."},
      {type:"mc",q:"Welche Einheit hat die elektrische Stromstärke?",o:["Ampere (A)","Volt (V)","Ohm (Ω)","Watt (W)"],c:0,
       e:"Die Stromstärke wird in Ampere (A) gemessen, benannt nach André-Marie Ampère."},
      {type:"fillin",q:"Ein Widerstand von 1000 Ω wird mit 24 V betrieben. Wie groß ist der Strom in mA?",a:["24","24mA","24 mA"],
       e:"I = U/R = 24V / 1000Ω = 0,024A = 24mA"},
      {type:"tf",q:"Die elektrische Leistung berechnet sich mit P = U · I.",c:true,
       e:"Korrekt! P = U · I ist die Grundformel der elektrischen Leistung."},
      {type:"mc",q:"Welche Formel berechnet den Widerstand?",o:["R = U / I","R = U · I","R = I / U","R = P / I"],c:0,
       e:"Durch Umstellen des Ohmschen Gesetzes: R = U / I"},
      {type:"fillin",q:"Wie groß ist die Leistung bei U = 230V und I = 10A? (nur Zahl in Watt)",a:["2300"],
       e:"P = U · I = 230V · 10A = 2300W"}
    ]
  },
  {
    id:102, title:"Reihen- & Parallelschaltung",
    questions:[
      {type:"mc",q:"Wie verhält sich der Strom in einer Reihenschaltung?",o:["Er ist überall gleich","Er teilt sich auf","Er verdoppelt sich","Er ist null"],c:0,
       e:"In der Reihenschaltung fließt durch alle Bauteile der gleiche Strom."},
      {type:"mc",q:"Wie berechnet man den Gesamtwiderstand einer Parallelschaltung aus R1 und R2?",
       o:["R = (R1·R2)/(R1+R2)","R = R1 + R2","R = R1 · R2","R = R1 - R2"],c:0,
       e:"Für zwei parallele Widerstände: R_ges = (R1·R2)/(R1+R2). Dies ist die Produktsummenformel."},
      {type:"tf",q:"In einer Parallelschaltung ist die Spannung über allen Zweigen gleich.",c:true,
       e:"Richtig! In der Parallelschaltung liegt an jedem Zweig die gleiche Spannung an."},
      {type:"fillin",q:"R1=100Ω und R2=200Ω in Reihe. Gesamtwiderstand in Ω? (nur Zahl)",a:["300"],
       e:"Reihenschaltung: R_ges = R1 + R2 = 100Ω + 200Ω = 300Ω"},
      {type:"mc",q:"Zwei gleiche Widerstände (je 100Ω) parallel geschaltet ergeben:",o:["50 Ω","200 Ω","100 Ω","25 Ω"],c:0,
       e:"R_ges = (100·100)/(100+100) = 10000/200 = 50Ω. Bei zwei gleichen Widerständen parallel: R/2"}
    ]
  },
  {
    id:103, title:"Wechselstrom & Drehstrom",
    questions:[
      {type:"mc",q:"Welche Frequenz hat das europäische Stromnetz?",o:["50 Hz","60 Hz","100 Hz","25 Hz"],c:0,

// ============================================================
// GAME STATE
// ============================================================
let state = {
  xp: 0, level: 1, streak: 0, hearts: 5, maxHearts: 5,
  lastPlayDate: null, totalCorrect: 0, totalAnswered: 0,
  completedLessons: [], lessonScores: {},
  currentModule: null, currentLesson: null,
  currentQuestionIndex: 0, quizCorrect: 0, quizTotal: 0,
  quizQuestions: [], answered: false, quizStartTime: null
};

function loadState() {
  try {
    const s = localStorage.getItem('ap2trainer_state');
    if (s) {
      const loaded = JSON.parse(s);
      state = {...state, ...loaded};
    }
  } catch(e) {}
  checkStreak();
  checkHearts();
}

function saveState() {
  localStorage.setItem('ap2trainer_state', JSON.stringify(state));
}

function checkStreak() {
  const today = new Date().toDateString();
  if (state.lastPlayDate) {
    const last = new Date(state.lastPlayDate);
    const diff = Math.floor((new Date(today) - last) / 86400000);
    if (diff > 1) state.streak = 0;
  }
}

function checkHearts() {
  if (state.hearts < state.maxHearts) {
    // Regenerate a heart every 30 minutes
    const now = Date.now();
    const lastTime = state.lastHeartLoss || now;
    const elapsed = now - lastTime;
    const regen = Math.floor(elapsed / (30 * 60 * 1000));
    if (regen > 0) {
      state.hearts = Math.min(state.maxHearts, state.hearts + regen);
      saveState();
    }
  }
}

function updateTopBar() {
  document.getElementById('topXP').textContent = state.xp;
  document.getElementById('topStreak').textContent = state.streak;
  document.getElementById('topHearts').textContent = state.hearts;
}

// ============================================================
// SCREEN MANAGEMENT
// ============================================================
function showScreen(name) {
  ['homeScreen','quizScreen','resultsScreen','profileScreen'].forEach(s => {
    document.getElementById(s).classList.add('hidden');
  });
  document.getElementById('feedbackBar').classList.add('hidden');

  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(n => n.classList.remove('active'));

  switch(name) {
    case 'home':
      document.getElementById('homeScreen').classList.remove('hidden');
      navItems[0].classList.add('active');
      renderSkillTree();
      document.getElementById('bottomNav').classList.remove('hidden');
      break;
    case 'quiz':
      document.getElementById('quizScreen').classList.remove('hidden');
      document.getElementById('bottomNav').classList.add('hidden');
      break;
    case 'results':
      document.getElementById('resultsScreen').classList.remove('hidden');
      document.getElementById('bottomNav').classList.remove('hidden');
      break;
    case 'profile':
      document.getElementById('profileScreen').classList.remove('hidden');
      navItems[1].classList.add('active');
      renderProfile();
      document.getElementById('bottomNav').classList.remove('hidden');
      break;
  }
  updateTopBar();
}

// ============================================================
// SKILL TREE
// ============================================================
function isLessonAvailable(lessonId) {
  // First lesson of each module is available if previous module's first lesson is complete
  // or it's the first module
  const allLessons = [];
  MODULES.forEach(m => m.lessons.forEach(l => allLessons.push(l.id)));
  const idx = allLessons.indexOf(lessonId);
  if (idx === 0) return true;
  return state.completedLessons.includes(allLessons[idx - 1]);
}

function isLessonCompleted(lessonId) {
  return state.completedLessons.includes(lessonId);
}

function getLessonById(lessonId) {
  for (const m of MODULES) {
    for (const l of m.lessons) {
      if (l.id === lessonId) return {module: m, lesson: l};
    }
  }
  return null;
}

function renderSkillTree() {
  const tree = document.getElementById('skillTree');
  let html = '';
  
  MODULES.forEach((mod, mi) => {
    const completedInModule = mod.lessons.filter(l => isLessonCompleted(l.id)).length;
    const totalInModule = mod.lessons.length;
    
    html += `<div class="module-group">`;
    html += `<div class="module-section-title" style="border-color:${mod.color}40; background:linear-gradient(135deg, ${mod.color}15, var(--bg2))">
      <span class="mod-icon">${mod.icon}</span>
      ${mod.title}
      <div class="mod-progress">${completedInModule}/${totalInModule} abgeschlossen</div>
    </div>`;
    
    mod.lessons.forEach((lesson, li) => {
      const completed = isLessonCompleted(lesson.id);
      const available = isLessonAvailable(lesson.id);
      const status = completed ? 'completed' : (available ? 'available' : 'locked');
      const score = state.lessonScores[lesson.id];
      
      html += `<div class="lesson-node-wrap">
        <div class="lesson-node ${status}" 
             onclick="${status !== 'locked' ? `openLessonModal(${lesson.id})` : ''}"
             style="${status === 'available' ? `background:${mod.color};border-color:${mod.color}cc;box-shadow:0 6px 0 ${mod.color}99,0 8px 20px ${mod.color}30` : ''}">
          ${completed ? '<span class="crown">👑</span>' : ''}
          ${completed ? '⭐' : (available ? (li === 0 ? mod.icon : '📝') : '🔒')}
        </div>
        <div class="lesson-title">${lesson.title}${score ? ` (${score}%)` : ''}</div>
      </div>`;
    });
    
    html += `</div>`;
    if (mi < MODULES.length - 1) {
      html += `<div class="module-connector"></div>`;
    }
  });
  
  tree.innerHTML = html;
}

// ============================================================
// LESSON MODAL
// ============================================================
function openLessonModal(lessonId) {
  const data = getLessonById(lessonId);
  if (!data) return;
  
  const {module: mod, lesson} = data;
  const completed = isLessonCompleted(lessonId);
  const score = state.lessonScores[lessonId];
  
  document.getElementById('modalIcon').textContent = mod.icon;
  document.getElementById('modalTitle').textContent = lesson.title;
  document.getElementById('modalDesc').textContent = completed
    ? `Bereits abgeschlossen${score ? ` mit ${score}%` : ''}. Nochmal üben?`
    : `${lesson.questions.length} Fragen • ${mod.title}`;
  
  const btn = document.getElementById('modalBtn');
  btn.textContent = completed ? '🔄 WIEDERHOLEN' : '▶ STARTEN';
  btn.onclick = () => startLesson(lessonId);
  
  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.add('hidden');
}

// ============================================================
// QUIZ LOGIC
// ============================================================
function startLesson(lessonId) {
  if (state.hearts <= 0) {
    alert('Keine Herzen mehr! ❤️ Warte 30 Minuten oder komm später wieder.');
    return;
  }
  
  closeModal();
  const data = getLessonById(lessonId);
  if (!data) return;
  
  state.currentLesson = lessonId;
  state.currentModule = data.module.id;
  state.quizQuestions = shuffleArray([...data.lesson.questions]);
  state.currentQuestionIndex = 0;
  state.quizCorrect = 0;
  state.quizTotal = state.quizQuestions.length;
  state.answered = false;
  state.quizStartTime = Date.now();
  
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  if (state.currentQuestionIndex >= state.quizQuestions.length) {
    finishQuiz();
    return;
  }
  
  state.answered = false;
  const q = state.quizQuestions[state.currentQuestionIndex];
  const progress = ((state.currentQuestionIndex) / state.quizQuestions.length) * 100;
  
  document.getElementById('quizProgress').style.width = progress + '%';
  
  let heartsHtml = '';
  for (let i = 0; i < state.maxHearts; i++) {
    heartsHtml += i < state.hearts ? '❤️' : '🤍';
  }
  document.getElementById('quizHearts').innerHTML = heartsHtml;
  
  let html = `<div class="quiz-content" style="animation:slideUp 0.4s">`;
  html += `<div class="quiz-question">${q.q}</div>`;
  
  if (q.hint) {
    html += `<div class="quiz-hint">💡 ${q.hint}</div>`;
  }
  
  if (q.type === 'mc') {
    html += `<div class="quiz-options">`;
    const letters = ['A','B','C','D'];
    q.o.forEach((opt, i) => {
      html += `<div class="quiz-option" data-index="${i}" onclick="selectOption(this, ${i})">
        <span class="quiz-option-letter">${letters[i]}</span>
        <span>${opt}</span>
      </div>`;
    });
    html += `</div>`;
    html += `<button class="btn btn-primary btn-block" id="checkBtn" onclick="checkAnswer()" disabled>PRÜFEN</button>`;
  }
  else if (q.type === 'tf') {
    html += `<div class="tf-options">
      <div class="tf-option" data-value="true" onclick="selectTF(this, true)">✅ Richtig</div>
      <div class="tf-option" data-value="false" onclick="selectTF(this, false)">❌ Falsch</div>
    </div>`;
    html += `<button class="btn btn-primary btn-block" id="checkBtn" onclick="checkAnswer()" disabled>PRÜFEN</button>`;
  }
  else if (q.type === 'fillin') {
    html += `<input type="text" class="quiz-input" id="fillinInput" placeholder="Deine Antwort..." 
             onkeypress="if(event.key==='Enter')checkAnswer()" oninput="document.getElementById('checkBtn').disabled=!this.value.trim()">`;
    html += `<button class="btn btn-primary btn-block" id="checkBtn" onclick="checkAnswer()" disabled>PRÜFEN</button>`;
  }
  
  html += `</div>`;
  document.getElementById('quizContent').innerHTML = html;
  document.getElementById('feedbackBar').classList.add('hidden');
}

let selectedAnswer = null;

function selectOption(el, index) {
  if (state.answered) return;
  document.querySelectorAll('.quiz-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedAnswer = index;
  document.getElementById('checkBtn').disabled = false;
}

function selectTF(el, value) {
  if (state.answered) return;
  document.querySelectorAll('.tf-option').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  selectedAnswer = value;
  document.getElementById('checkBtn').disabled = false;
}

function checkAnswer() {
  if (state.answered) return;
  state.answered = true;
  
  const q = state.quizQuestions[state.currentQuestionIndex];
  let isCorrect = false;
  
  if (q.type === 'mc') {
    isCorrect = selectedAnswer === q.c;
    document.querySelectorAll('.quiz-option').forEach((o, i) => {
      if (i === q.c) o.classList.add('correct');
      if (i === selectedAnswer && !isCorrect) o.classList.add('wrong');
      o.style.pointerEvents = 'none';
    });
  }
  else if (q.type === 'tf') {
    isCorrect = selectedAnswer === q.c;
    document.querySelectorAll('.tf-option').forEach(o => {
      const val = o.dataset.value === 'true';
      if (val === q.c) o.classList.add('correct');
      if (val === selectedAnswer && !isCorrect) o.classList.add('wrong');
      o.style.pointerEvents = 'none';
    });
  }
  else if (q.type === 'fillin') {
    const input = document.getElementById('fillinInput');
    const userAnswer = input.value.trim();
    isCorrect = q.a.some(a => a.toLowerCase() === userAnswer.toLowerCase());
    input.classList.add(isCorrect ? 'correct' : 'wrong');
    input.disabled = true;
    if (!isCorrect) {
      input.value = userAnswer + '  →  ' + q.a[0];
    }
  }
  
  document.getElementById('checkBtn').classList.add('hidden');
  
  if (isCorrect) {
    state.quizCorrect++;
    state.totalCorrect++;
    showFeedback(true, q.e);
    showXPPopup('+10 XP');
  } else {
    state.hearts = Math.max(0, state.hearts - 1);
    state.lastHeartLoss = Date.now();
    showFeedback(false, q.e);
    updateTopBar();
  }
  
  state.totalAnswered++;
  saveState();
}

function showFeedback(correct, explanation) {
  const bar = document.getElementById('feedbackBar');
  bar.className = `feedback-bar ${correct ? 'correct' : 'wrong'}`;
  document.getElementById('fbIcon').textContent = correct ? '🎉' : '😔';
  document.getElementById('fbTitle').textContent = correct ? 'Richtig!' : 'Leider falsch';
  document.getElementById('fbText').textContent = explanation || '';
  bar.classList.remove('hidden');
  
  const btn = document.getElementById('fbBtn');
  btn.textContent = 'WEITER';
  btn.className = `btn btn-sm ${correct ? 'btn-primary' : 'btn-secondary'}`;
  
  if (state.hearts <= 0) {
    btn.textContent = 'KEINE HERZEN';
    btn.onclick = () => {
      showScreen('home');
      document.getElementById('feedbackBar').classList.add('hidden');
    };
  } else {
    btn.onclick = nextQuestion;
  }
}

function nextQuestion() {
  document.getElementById('feedbackBar').classList.add('hidden');
  selectedAnswer = null;
  state.currentQuestionIndex++;
  
  if (state.hearts <= 0) {
    finishQuiz();
    return;
  }
  
  renderQuestion();
}

function quitQuiz() {
  if (confirm('Willst du die Lektion wirklich abbrechen?')) {
    document.getElementById('feedbackBar').classList.add('hidden');
    showScreen('home');
  }
}

function finishQuiz() {
  const percentage = Math.round((state.quizCorrect / state.quizTotal) * 100);
  const xpEarned = state.quizCorrect * 10;
  const timeSpent = Math.round((Date.now() - state.quizStartTime) / 1000);
  const minutes = Math.floor(timeSpent / 60);
  const seconds = timeSpent % 60;
  
  state.xp += xpEarned;
  state.level = Math.floor(state.xp / 100) + 1;
  
  // Update streak
  const today = new Date().toDateString();
  if (state.lastPlayDate !== today) {
    const last = state.lastPlayDate ? new Date(state.lastPlayDate) : null;
    const diff = last ? Math.floor((new Date(today) - last) / 86400000) : 999;
    if (diff === 1) state.streak++;
    else if (diff > 1) state.streak = 1;
    else state.streak = Math.max(state.streak, 1);
    state.lastPlayDate = today;
  }
  
  // Mark lesson
  if (percentage >= 60 && !state.completedLessons.includes(state.currentLesson)) {
    state.completedLessons.push(state.currentLesson);
  }
  state.lessonScores[state.currentLesson] = Math.max(
    state.lessonScores[state.currentLesson] || 0, percentage
  );
  
  saveState();
  
  // Render results
  let icon, title, subtitle;
  if (percentage === 100) { icon = '🏆'; title = 'Perfekt!'; subtitle = 'Alle Fragen richtig – du bist ein Profi!'; }
  else if (percentage >= 80) { icon = '🌟'; title = 'Ausgezeichnet!'; subtitle = 'Hervorragende Leistung!'; }
  else if (percentage >= 60) { icon = '👍'; title = 'Gut gemacht!'; subtitle = 'Lektion bestanden! Weiter so!'; }
  else { icon = '📚'; title = 'Weiter üben!'; subtitle = 'Du brauchst mindestens 60% zum Bestehen.'; }
  
  document.getElementById('resultsScreen').innerHTML = `
    <div class="results">
      <span class="results-icon">${icon}</span>
      <h1>${title}</h1>
      <p class="results-subtitle">${subtitle}</p>
      <div class="results-stats">
        <div class="results-stat xp">
          <span class="results-stat-value">+${xpEarned}</span>
          <span class="results-stat-label">XP verdient</span>
        </div>
        <div class="results-stat acc">
          <span class="results-stat-value">${percentage}%</span>
          <span class="results-stat-label">Genauigkeit</span>
        </div>
        <div class="results-stat time">
          <span class="results-stat-value">${minutes}:${seconds.toString().padStart(2,'0')}</span>
          <span class="results-stat-label">Zeit</span>
        </div>
      </div>
      <p style="color:var(--text2);margin-bottom:8px;font-size:14px">${state.quizCorrect} von ${state.quizTotal} Fragen richtig</p>
      <button class="btn btn-primary btn-block" onclick="showScreen('home')" style="margin-top:20px">WEITER LERNEN</button>
      ${percentage < 100 ? `<button class="btn btn-secondary btn-block" onclick="startLesson(${state.currentLesson})" style="margin-top:10px">🔄 WIEDERHOLEN</button>` : ''}
    </div>`;
  
  showScreen('results');
  document.getElementById('feedbackBar').classList.add('hidden');
}

// ============================================================
// PROFILE
// ============================================================
function renderProfile() {
  const totalLessons = MODULES.reduce((s, m) => s + m.lessons.length, 0);
  const completed = state.completedLessons.length;
  const accuracy = state.totalAnswered > 0 ? Math.round((state.totalCorrect / state.totalAnswered) * 100) : 0;
  const xpForNext = (state.level * 100) - state.xp;
  const xpProgress = ((state.xp % 100) / 100) * 100;
  
  document.getElementById('profileScreen').innerHTML = `
    <div class="profile-card">
      <span class="profile-avatar">⚡</span>
      <h2>Automatisierungsprofi</h2>
      <span class="profile-level">Level ${state.level}</span>
      <div class="profile-xp-bar"><div class="profile-xp-fill" style="width:${xpProgress}%"></div></div>
      <p style="font-size:13px;color:var(--text2)">${state.xp} XP • Noch ${xpForNext} XP bis Level ${state.level + 1}</p>
    </div>
    
    <div class="daily-goal">
      <h3>🎯 Tägliches Ziel</h3>
      <p style="color:var(--text2);font-size:14px">Schließe jeden Tag mindestens eine Lektion ab!</p>
      <div class="daily-progress">
        ${[0,1,2,3,4,5,6].map(i => {
          const d = new Date();
          d.setDate(d.getDate() - (6-i));
          const dayStr = d.toDateString();
          const done = state.lastPlayDate === dayStr || (state.streak > (6-i) && i <= 6);
          const labels = ['Mo','Di','Mi','Do','Fr','Sa','So'];
          return `<div class="daily-dot ${i === 6 && state.lastPlayDate === new Date().toDateString() ? 'done' : ''}">${labels[d.getDay() === 0 ? 6 : d.getDay()-1]}</div>`;
        }).join('')}
      </div>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-card-icon">⭐</span>
        <span class="stat-card-value" style="color:var(--gold)">${state.xp}</span>
        <span class="stat-card-label">Gesamt-XP</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">🔥</span>
        <span class="stat-card-value" style="color:var(--orange)">${state.streak}</span>
        <span class="stat-card-label">Tage-Streak</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">✅</span>
        <span class="stat-card-value" style="color:var(--green)">${completed}/${totalLessons}</span>
        <span class="stat-card-label">Lektionen</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">🎯</span>
        <span class="stat-card-value" style="color:var(--blue)">${accuracy}%</span>
        <span class="stat-card-label">Genauigkeit</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">📝</span>
        <span class="stat-card-value">${state.totalAnswered}</span>
        <span class="stat-card-label">Fragen beantwortet</span>
      </div>
      <div class="stat-card">
        <span class="stat-card-icon">❤️</span>
        <span class="stat-card-value" style="color:var(--red)">${state.hearts}/${state.maxHearts}</span>
        <span class="stat-card-label">Herzen</span>
      </div>
    </div>
    
    <h3 style="margin:24px 0 12px;font-size:16px">📊 Fortschritt nach Modulen</h3>
    ${MODULES.map(m => {
      const done = m.lessons.filter(l => isLessonCompleted(l.id)).length;
      const total = m.lessons.length;
      const pct = Math.round((done/total)*100);
      return `<div style="background:var(--bg2);border-radius:var(--radius-sm);padding:16px;margin-bottom:8px;border:2px solid var(--bg3)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-weight:700">${m.icon} ${m.title}</span>
          <span style="font-size:13px;color:var(--text2)">${done}/${total}</span>
        </div>
        <div style="height:8px;background:var(--bg3);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${m.color};border-radius:4px;transition:width 0.5s"></div>
        </div>
      </div>`;
    }).join('')}
    
    <button class="btn btn-secondary btn-block" onclick="if(confirm('Fortschritt wirklich zurücksetzen?')){localStorage.removeItem('ap2trainer_state');location.reload()}" style="margin-top:24px">
      🗑️ Fortschritt zurücksetzen
    </button>`;
}

// ============================================================
// UTILITIES
// ============================================================
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showXPPopup(text) {
  const popup = document.createElement('div');
  popup.className = 'xp-popup';
  popup.textContent = text;
  document.body.appendChild(popup);
  setTimeout(() => popup.remove(), 1200);
}

// ============================================================
// INIT
// ============================================================
loadState();
showScreen('home');
updateTopBar();
</script>
