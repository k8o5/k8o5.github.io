<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AP2-Trainer – Elektroniker für Automatisierungstechnik</title>
<style>
  :root{
    --green:#58cc02; --green-dark:#46a302; --red:#ff4b4b; --blue:#1cb0f6;
    --gold:#ffc800; --gray:#e5e5e5; --text:#3c3c3c; --bg:#f7f7f7;
  }
  *{box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:var(--bg); color:var(--text); min-height:100vh;}
  header{background:#fff; border-bottom:2px solid var(--gray); padding:12px 20px;
    display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:10;}
  .logo{font-weight:800; color:var(--green); font-size:1.3em; cursor:pointer;}
  .stats{display:flex; gap:18px; font-weight:700;}
  .stat{display:flex; align-items:center; gap:5px; font-size:1.05em;}
  .container{max-width:720px; margin:0 auto; padding:20px;}
  h1{font-size:1.5em; margin-bottom:6px;}
  .sub{color:#888; margin-bottom:22px;}
  /* Lektionskarten */
  .topic{background:#fff; border:2px solid var(--gray); border-radius:16px; padding:18px;
    margin-bottom:14px; display:flex; align-items:center; gap:16px; cursor:pointer; transition:.15s;}
  .topic:hover{transform:translateY(-2px); box-shadow:0 4px 12px rgba(0,0,0,.08);}
  .topic .icon{font-size:2.2em; width:60px; height:60px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; background:var(--bg); flex-shrink:0;}
  .topic .info{flex:1;}
  .topic .info h3{margin-bottom:4px;}
  .topic .info p{color:#888; font-size:.9em;}
  .crownbox{display:flex; flex-direction:column; align-items:center; font-weight:800; color:var(--gold);}
  .progressbar{height:10px; background:var(--gray); border-radius:5px; margin-top:8px; overflow:hidden;}
  .progressbar > div{height:100%; background:var(--green); border-radius:5px; transition:width .4s;}
  .exam-card{background:linear-gradient(135deg,#7c4dff,#1cb0f6); color:#fff; border:none;}
  .exam-card p{color:rgba(255,255,255,.85)!important;}
  /* Quiz */
  .quiz-top{display:flex; align-items:center; gap:14px; margin-bottom:24px;}
  .quiz-top .close{font-size:1.6em; cursor:pointer; color:#aaa; background:none; border:none;}
  .quiz-top .progressbar{flex:1; margin:0;}
  .hearts{font-weight:800; color:var(--red);}
  .question{font-size:1.25em; font-weight:700; margin-bottom:8px;}
  .qtag{display:inline-block; background:#e3f3ff; color:var(--blue); padding:3px 10px;
    border-radius:10px; font-size:.8em; font-weight:700; margin-bottom:14px;}
  .answers{display:grid; gap:10px; margin-top:18px;}
  .answer{background:#fff; border:2px solid var(--gray); border-bottom-width:4px;
    border-radius:12px; padding:14px 16px; cursor:pointer; font-size:1em; text-align:left;
    transition:.1s; font-weight:600; color:var(--text);}
  .answer:hover{background:#f0faff; border-color:var(--blue);}
  .answer.selected{background:#e3f3ff; border-color:var(--blue); color:var(--blue);}
  .answer.correct{background:#d7ffb8; border-color:var(--green); color:var(--green-dark);}
  .answer.wrong{background:#ffdfe0; border-color:var(--red); color:var(--red);}
  .answer:disabled{cursor:default;}
  /* Feedback-Banner */
  .banner{position:fixed; left:0; right:0; bottom:0; padding:18px 20px 26px;
    display:none; z-index:20;}
  .banner.ok{display:block; background:#d7ffb8;}
  .banner.no{display:block; background:#ffdfe0;}
  .banner .inner{max-width:720px; margin:0 auto; display:flex; align-items:center;
    justify-content:space-between; gap:16px; flex-wrap:wrap;}
  .banner h2{font-size:1.15em;}
  .banner.ok h2{color:var(--green-dark);} .banner.no h2{color:var(--red);}
  .banner p{font-size:.92em; margin-top:4px; max-width:480px;}
  .btn{border:none; border-radius:12px; padding:13px 34px; font-size:1em; font-weight:800;
    cursor:pointer; text-transform:uppercase; letter-spacing:.5px; color:#fff;
    box-shadow:0 4px 0 rgba(0,0,0,.18); transition:.1s;}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18);}
  .btn.green{background:var(--green);} .btn.red{background:var(--red);}
  .btn.blue{background:var(--blue);} .btn.gray{background:#aaa;}
  .btn:disabled{background:var(--gray); color:#aaa; box-shadow:none; cursor:default;}
  .checkbar{margin-top:26px; display:flex; justify-content:flex-end;}
  /* Ergebnis */
  .result{text-align:center; padding:40px 20px;}
  .result .big{font-size:4em; margin-bottom:10px;}
  .result h1{margin-bottom:10px;}
  .rstats{display:flex; justify-content:center; gap:16px; margin:26px 0;}
  .rstat{background:#fff; border:2px solid var(--gray); border-radius:14px; padding:14px 22px; min-width:110px;}
  .rstat .val{font-size:1.5em; font-weight:800;}
  .rstat .lbl{font-size:.8em; color:#888; text-transform:uppercase; font-weight:700;}
  .hidden{display:none;}
  .timer{font-weight:800; color:#7c4dff;}
  @media(max-width:520px){ .stats{gap:10px; font-size:.85em;} }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goHome()">⚡ AP2-Trainer</div>
  <div class="stats">
    <div class="stat">🔥 <span id="streak">0</span></div>
    <div class="stat" style="color:var(--gold)">⭐ <span id="xp">0</span> XP</div>
    <div class="stat" style="color:var(--red)">❤️ <span id="hearts">5</span></div>
  </div>
</header>

<div class="container" id="app"></div>

<div class="banner" id="banner">
  <div class="inner">
    <div><h2 id="bTitle"></h2><p id="bText"></p></div>
    <button class="btn" id="bBtn" onclick="nextQuestion()">Weiter</button>
  </div>
</div>

// ================== STATE ==================
let S = JSON.parse(localStorage.getItem("ap2state") || "null") || {
  xp:0, hearts:5, streak:0, lastDay:"", topicProgress:{}, crowns:{}
};
function save(){ localStorage.setItem("ap2state", JSON.stringify(S)); }
function today(){ return new Date().toISOString().slice(0,10); }

let quiz = null; // {questions, idx, correct, topicId, isExam, startTime}
let timerInt = null;

// ================== UI HELPERS ==================
const app = document.getElementById("app");
function updateHeader(){
  document.getElementById("streak").textContent = S.streak;
  document.getElementById("xp").textContent = S.xp;
  document.getElementById("hearts").textContent = S.hearts;
}
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function hideBanner(){ document.getElementById("banner").className = "banner"; }

// ================== HOME ==================
function goHome(){
  clearInterval(timerInt); hideBanner(); updateHeader();
  let html = `<h1>Hallo, zukünftige Elektrofachkraft! 👋</h1>
  <p class="sub">Wähle eine Lektion und sammle XP für deine AP2-Vorbereitung.</p>`;
  html += `<div class="topic exam-card" onclick="startExam()">
    <div class="icon" style="background:rgba(255,255,255,.2)">🏆</div>
    <div class="info"><h3>Prüfungssimulation</h3><p>20 gemischte Fragen · 25 Minuten · doppelte XP</p></div>
  </div>`;
  for(const t of TOPICS){
    const prog = S.topicProgress[t.id] || 0;
    const pct = Math.min(100, Math.round(prog/t.questions.length*100));
    const crowns = S.crowns[t.id] || 0;
    html += `<div class="topic" onclick="startLesson('${t.id}')">
      <div class="icon">${t.icon}</div>
      <div class="info"><h3>${t.name}</h3><p>${t.desc} · ${t.questions.length} Fragen</p>
      <div class="progressbar"><div style="width:${pct}%"></div></div></div>
      <div class="crownbox">👑<span>${crowns}</span></div>
    </div>`;
  }
  app.innerHTML = html;
}

// ================== LESSON / EXAM ==================
function checkHearts(){
  if(S.hearts <= 0){
    app.innerHTML = `<div class="result"><div class="big">💔</div>
      <h1>Keine Herzen mehr!</h1>
      <p class="sub">Übe eine abgeschlossene Lektion oder fülle deine Herzen mit 50 XP auf.</p>
      <div class="rstats"><div class="rstat"><div class="val">⭐ ${S.xp}</div><div class="lbl">Deine XP</div></div></div>
      <button class="btn blue" ${S.xp<50?"disabled":""} onclick="S.xp-=50;S.hearts=5;save();updateHeader();goHome()">50 XP → 5 ❤️</button>
      <br><br><button class="btn gray" onclick="goHome()">Zurück</button></div>`;
    return false;
  }
  return true;
}

function startLesson(topicId){
  if(!checkHearts()) return;
  const t = TOPICS.find(x=>x.id===topicId);
  const qs = shuffle(t.questions).slice(0,8).map(q=>prepQuestion(q));
  quiz = {questions:qs, idx:0, correct:0, topicId, isExam:false};
  renderQuestion();
}

function startExam(){
  if(!checkHearts()) return;
  let pool = [];
  TOPICS.forEach(t => t.questions.forEach(q => pool.push({...q, tag:t.name})));
  const qs = shuffle(pool).slice(0,20).map(q=>prepQuestion(q));
  quiz = {questions:qs, idx:0, correct:0, topicId:null, isExam:true, timeLeft:25*60};
  renderQuestion();
  timerInt = setInterval(()=>{
    quiz.timeLeft--;
    const el = document.getElementById("timer");
    if(el) el.textContent = fmtTime(quiz.timeLeft);
    if(quiz.timeLeft<=0){ clearInterval(timerInt); showResult(); }
  },1000);
}
function fmtTime(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function prepQuestion(q){
  // Antworten mischen, korrekten Index nachführen
  const order = shuffle([0,1,2,3]);
  return { q:q.q, e:q.e, tag:q.tag||null,
    a:order.map(i=>q.a[i]), c:order.indexOf(q.c) };
}

let selected = -1, answered = false;
function renderQuestion(){
  hideBanner(); selected = -1; answered = false;
  const cq = quiz.questions[quiz.idx];
  const pct = Math.round(quiz.idx / quiz.questions.length * 100);
  let html = `<div class="quiz-top">
    <button class="close" onclick="if(confirm('Lektion wirklich abbrechen?')){clearInterval(timerInt);goHome()}">✕</button>
    <div class="progressbar"><div style="width:${pct}%"></div></div>
    ${quiz.isExam ? `<span class="timer" id="timer">${fmtTime(quiz.timeLeft)}</span>` : ""}
    <span class="hearts">❤️ ${S.hearts}</span>
  </div>`;
  if(cq.tag) html += `<span class="qtag">${cq.tag}</span><br>`;
  html += `<div class="question">${cq.q}</div><div class="answers">`;
  cq.a.forEach((ans,i)=>{
    html += `<button class="answer" id="ans${i}" onclick="selectAnswer(${i})">${ans}</button>`;
  });
  html += `</div><div class="checkbar"><button class="btn green" id="checkBtn" disabled onclick="checkAnswer()">Prüfen</button></div>`;
  app.innerHTML = html;
  window.scrollTo(0,0);
}

function selectAnswer(i){
  if(answered) return;
  selected = i;
  quiz.questions[quiz.idx].a.forEach((_,j)=>{
    document.getElementById("ans"+j).className = "answer" + (j===i ? " selected" : "");
  });
  document.getElementById("checkBtn").disabled = false;
}

function checkAnswer(){
  if(selected < 0 || answered) return;
  answered = true;
  const cq = quiz.questions[quiz.idx];
  const banner = document.getElementById("banner");
  const correct = selected === cq.c;
  cq.a.forEach((_,j)=>{
    const el = document.getElementById("ans"+j);
    el.disabled = true;
    if(j===cq.c) el.classList.add("correct");
    else if(j===selected) el.classList.add("wrong");
  });
  document.getElementById("checkBtn").style.visibility = "hidden";
  if(correct){
    quiz.correct++;
    document.getElementById("bTitle").textContent = ["Richtig! 🎉","Stark! 💪","Sauber gelöst! ⚡","Genau so! ✅"][Math.floor(Math.random()*4)];
    document.getElementById("bText").textContent = cq.e || "";
    document.getElementById("bBtn").className = "btn green";
    banner.className = "banner ok";
  } else {
    S.hearts = Math.max(0, S.hearts-1); save(); updateHeader();
    document.getElementById("bTitle").textContent = "Leider falsch. Richtig wäre: " + cq.a[cq.c];
    document.getElementById("bText").textContent = cq.e || "";
    document.getElementById("bBtn").className = "btn red";
    banner.className = "banner no";
    document.querySelector(".quiz-top .hearts").textContent = "❤️ " + S.hearts;
  }
}

function nextQuestion(){
  hideBanner();
  if(S.hearts<=0 && !quiz.isExam){ clearInterval(timerInt); checkHearts(); return; }
  quiz.idx++;
  if(quiz.idx >= quiz.questions.length){ clearInterval(timerInt); showResult(); }
  else renderQuestion();
}

// ================== RESULT ==================
function showResult(){
  hideBanner();
  const total = quiz.questions.length;
  const pctScore = Math.round(quiz.correct/total*100);
  let xpGain = quiz.correct * (quiz.isExam ? 4 : 2);
  if(pctScore === 100) xpGain += 10;
  S.xp += xpGain;
  // Streak
  const d = today();
  if(S.lastDay !== d){
    const yest = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay === yest) ? S.streak+1 : 1;
    S.lastDay = d;
  }
  // Fortschritt & Kronen
  if(quiz.topicId){
    S.topicProgress[quiz.topicId] = Math.max(S.topicProgress[quiz.topicId]||0, quiz.correct);
    if(pctScore >= 80) S.crowns[quiz.topicId] = (S.crowns[quiz.topicId]||0)+1;
  }
  if(pctScore === 100 && S.hearts < 5) S.hearts++; // Bonus-Herz
  save(); updateHeader();

  // IHK-Note grob (Prüfungsmodus)
  let note = "";
  if(quiz.isExam){
    const n = pctScore>=92?"1 (sehr gut)":pctScore>=81?"2 (gut)":pctScore>=67?"3 (befriedigend)":pctScore>=50?"4 (ausreichend)":pctScore>=30?"5 (mangelhaft)":"6 (ungenügend)";
    note = `<div class="rstat"><div class="val">${n.split(" ")[0]}</div><div class="lbl">IHK-Note*</div></div>`;
  }
  app.innerHTML = `<div class="result">
    <div class="big">${pctScore>=80?"🏆":pctScore>=50?"👍":"📚"}</div>
    <h1>${pctScore>=80?"Hervorragend!":pctScore>=50?"Gut gemacht – weiter so!":"Da geht noch was. Wiederhole die Lektion!"}</h1>
    <p class="sub">${quiz.correct} von ${total} Fragen richtig</p>
    <div class="rstats">
      <div class="rstat"><div class="val" style="color:var(--gold)">+${xpGain}</div><div class="lbl">XP</div></div>
      <div class="rstat"><div class="val" style="color:var(--green)">${pctScore} %</div><div class="lbl">Genauigkeit</div></div>
      ${note}
    </div>
    ${quiz.isExam?'<p class="sub">*Orientierung nach IHK-Notenschlüssel (100-Punkte-Schema)</p>':''}
    ${pctScore===100?'<p class="sub">💚 Perfekt! Bonus-Herz erhalten.</p>':''}
    <button class="btn blue" onclick="${quiz.isExam?"startExam()":"startLesson('"+quiz.topicId+"')"}">Nochmal</button>
    &nbsp;<button class="btn green" onclick="goHome()">Weiter lernen</button>
  </div>`;
}

// Herz-Regeneration: 1 Herz pro Tag beim Öffnen
(function(){
  const d = today();
  if(S.lastHeartDay !== d && S.hearts < 5){ S.hearts++; S.lastHeartDay = d; save(); }
})();

goHome();
</script>
