<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IHK-Lingo ⚡ Elektrotechnik AP2</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#58cc02;--green-d:#58a700;--green-l:#d7ffb8;--red:#ff4b4b;--red-d:#ea2b2b;--red-l:#ffdfe0;--blue:#1cb0f6;--blue-d:#1899d6;--blue-l:#ddf4ff;--gold:#ffc800;--gold-d:#e5a400;--gray:#e5e5e5;--gray-d:#afafaf;--text:#3c3c3c;--muted:#777;--bg:#fff;--bg2:#f7f7f7}
[data-theme=dark]{--bg:#131f24;--bg2:#1b2b32;--gray:#37464f;--gray-d:#52656d;--text:#f1f7fb;--muted:#8fa2ab;--green-l:#1f3416;--red-l:#3b1d22;--blue-l:#16303d;--green-d:#79d635;--red-d:#ff7b7b;--blue-d:#49c0f8;--gold-d:#ffc800}
[data-theme=dark] .btn{color:#131f24;box-shadow:0 4px 0 #58a700}
[data-theme=dark] .btn.skip,[data-theme=dark] .btn.ghost{box-shadow:0 4px 0 var(--gray)}
[data-theme=dark] .btn:disabled{color:var(--gray-d);box-shadow:0 4px 0 #2a373d}
[data-theme=dark] .btn.red{box-shadow:0 4px 0 #ea2b2b}
[data-theme=dark] .btn.blue{box-shadow:0 4px 0 #1899d6}
[data-theme=dark] .lfoot.bad #chk{box-shadow:0 4px 0 #ea2b2b}
[data-theme=dark] .node.locked{box-shadow:0 7px 0 #2a373d!important}
body,.top,.lhead,.lfoot,.screen,#lesson{transition:background-color .3s,color .3s,border-color .3s}
/* MASKOTTCHEN */
.volti{overflow:visible;cursor:pointer;transform-origin:50% 90%;user-select:none}
.volti .pupils{transition:transform .08s linear}
.volti .lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);transition:transform .08s}
.volti.blink .lid,.volti.sleep .lid{transform:scaleY(1)}
.volti .arm{transition:transform .25s;transform-box:fill-box}
.volti .arm.l{transform-origin:100% 0}.volti .arm.r{transform-origin:0 0}
.volti:hover .arm.r{animation:wave .6s ease-in-out 2}
@keyframes wave{50%{transform:rotate(-35deg)}}
.volti.happy{animation:vjump .55s cubic-bezier(.3,1.6,.6,1)}
.volti.happy .arm.l{transform:rotate(40deg)}.volti.happy .arm.r{transform:rotate(-40deg)}
.volti.excited{animation:vspin .8s ease-in-out}
.volti.excited .arm.l{transform:rotate(50deg)}.volti.excited .arm.r{transform:rotate(-50deg)}
.volti.sad{animation:vshake .45s}
.volti.sad .arm.l{transform:rotate(-25deg)}.volti.sad .arm.r{transform:rotate(25deg)}
.volti.think{animation:vtilt 1.2s ease-in-out infinite}
.volti.worried{animation:vshiver .25s linear infinite}
.volti.sleep{animation:vbreath 2.4s ease-in-out infinite}
.volti.poke{animation:vsquish .35s}
.volti.dizzy{animation:vspin 1s linear 2}
.volti .zzz{opacity:0}.volti.sleep .zzz{opacity:1;animation:zzz 2s ease-in-out infinite}
.volti .spark{opacity:0}.volti.happy .spark,.volti.excited .spark{animation:spark .7s}
@keyframes vjump{40%{transform:translateY(-18px) scale(1.05,.95)}70%{transform:translateY(0) scale(1.08,.9)}}
@keyframes vspin{50%{transform:translateY(-14px) rotate(180deg)}100%{transform:rotate(360deg)}}
@keyframes vshake{20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes vtilt{50%{transform:rotate(-7deg)}}
@keyframes vshiver{50%{transform:translateX(1.5px)}}
@keyframes vbreath{50%{transform:scale(1.03,.97)}}
@keyframes vsquish{40%{transform:scale(1.15,.82)}}
@keyframes zzz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(8px,-14px);opacity:0}}
@keyframes spark{0%{opacity:0;transform:scale(.3)}40%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.mascot{position:relative}
.pop{position:absolute;left:50%;top:-6px;transform:translateX(-50%);white-space:nowrap;background:var(--gold);color:#3c3c3c;font-weight:900;font-size:13px;padding:4px 10px;border-radius:10px;pointer-events:none;animation:popup 1.6s forwards;z-index:3}
@keyframes popup{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,-14px) scale(1.1)}80%{opacity:1;transform:translate(-50%,-26px)}100%{opacity:0;transform:translate(-50%,-34px)}}
.hint-lbl{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;font-weight:800}
.opt.elim{opacity:.35;pointer-events:none;text-decoration:line-through}
.hero{display:flex;align-items:center;gap:14px;margin:18px 18px 0}
.hero-m{flex:0 0 100px}
.say{position:relative;flex:1;border:2px solid var(--gray);border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.4;min-height:60px;display:flex;align-items:center}
.say::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-8px;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--gray);border-bottom:2px solid var(--gray);transform:rotate(45deg)}
.say.type{animation:sayin .3s}
@keyframes sayin{from{transform:scale(.9);opacity:0}}
.fb .ic{overflow:visible}
.theme-btn{cursor:pointer}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:Nunito,"Segoe UI",system-ui,sans-serif;color:var(--text);background:var(--bg);font-weight:700}
.review div{background:var(--bg2)!important}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.btn{border:none;border-radius:16px;padding:14px 22px;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-d);transition:transform .05s,filter .1s}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn:disabled{background:var(--gray);color:var(--gray-d);box-shadow:0 4px 0 #d0d0d0;cursor:default}
.btn.red{background:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.ghost{background:var(--bg);color:var(--blue);border:2px solid var(--gray);box-shadow:0 4px 0 var(--gray)}
/* HOME */
#home{max-width:640px;margin:0 auto;padding-bottom:60px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--gray);display:flex;align-items:center;justify-content:space-between;padding:12px 18px}
.logo{font-weight:900;font-size:24px;color:var(--green);letter-spacing:-.5px}
.stats{display:flex;gap:16px;font-size:17px;font-weight:800}
.stats span{display:flex;align-items:center;gap:4px}
.stat-fire{color:#ff9600}.stat-xp{color:var(--gold-d)}.stat-snd{cursor:pointer;filter:grayscale(0)}
.goal{margin:18px;border:2px solid var(--gray);border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:14px}
.goal .bar{flex:1;height:16px;background:var(--gray);border-radius:10px;overflow:hidden}
.goal .bar i{display:block;height:100%;background:var(--gold);border-radius:10px;transition:width .5s}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 18px 10px}
.actions .btn{font-size:14px;padding:14px 10px}
.unit-head{margin:28px 18px 10px;border-radius:16px;padding:16px 20px;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.18)}
.unit-head small{display:block;opacity:.85;font-size:13px;text-transform:uppercase;letter-spacing:1px}
.unit-head b{font-size:21px;font-weight:900}
.unit-head .cnt{float:right;font-size:13px;opacity:.9;margin-top:4px}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 0}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:none;font-size:30px;color:#fff;transition:transform .1s}
.node:active{transform:translateY(5px)}
.node.locked{background:var(--gray)!important;box-shadow:0 7px 0 #c9c9c9!important;filter:grayscale(1);opacity:.85}
.node.done{background:var(--gold)!important;box-shadow:0 7px 0 var(--gold-d)!important}
.node .lbl{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap;font-weight:800}
.node.next::before{content:"START";position:absolute;top:-44px;left:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--gray);color:var(--green);font-size:14px;font-weight:900;padding:6px 12px;border-radius:12px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:40px}
.foot a{color:var(--blue);cursor:pointer}
/* LESSON */
#lesson{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.lhead{max-width:1000px;width:100%;margin:0 auto;display:flex;align-items:center;gap:16px;padding:22px 20px 8px}
.x{background:none;border:none;font-size:30px;color:var(--gray-d);line-height:1;padding:0 4px}
.prog{flex:1;height:16px;background:var(--gray);border-radius:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--green);border-radius:10px;transition:width .4s;position:relative}
.prog i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:4px;border-radius:4px;background:rgba(255,255,255,.35)}
.hearts{color:var(--red);font-weight:900;font-size:18px;white-space:nowrap}
.timer{color:var(--blue);font-weight:900;font-size:16px;white-space:nowrap}
.lbody{flex:1;overflow-y:auto;padding:16px 20px 30px}
.qwrap{max-width:620px;margin:0 auto}
.qtype{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.qtype .tag{background:var(--blue-l);color:var(--blue-d);padding:3px 9px;border-radius:8px;font-size:11px}
.qrow{display:flex;gap:12px;align-items:flex-start;margin-bottom:22px}
.mascot{flex:0 0 74px}
.bubble{position:relative;border:2px solid var(--gray);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.45;font-weight:700}
.bubble::before{content:"";position:absolute;left:-10px;top:22px;width:16px;height:16px;background:var(--bg);border-left:2px solid var(--gray);border-bottom:2px solid var(--gray);transform:rotate(45deg)}
.bubble em{color:var(--red-d);font-style:normal;text-decoration:underline}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;background:var(--bg);border:2px solid var(--gray);border-bottom-width:4px;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:700;color:var(--text);transition:background .1s}
.opt:hover{background:var(--bg2)}
.opt .k{flex:0 0 30px;height:30px;border:2px solid var(--gray);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--gray-d)}
.opt.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
.opt.sel .k{border-color:#84d8ff;color:var(--blue-d)}
.opt.ok{border-color:var(--green);background:var(--green-l);color:var(--green-d)}
.opt.bad{border-color:var(--red);background:var(--red-l);color:var(--red-d)}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfrow .opt{justify-content:center;font-size:20px;padding:24px}
.numrow{display:flex;align-items:center;gap:12px}
.numrow input{flex:1;font:inherit;font-size:24px;font-weight:800;padding:14px 18px;border:2px solid var(--gray);border-radius:14px;background:var(--bg2);outline:none;color:var(--text)}
.numrow input:focus{border-color:#84d8ff;background:var(--bg)}
.numrow .u{font-size:22px;font-weight:900;color:var(--muted);min-width:40px}
.hint{color:var(--muted);font-size:13px;margin-top:8px}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:10px}
.mi{border:2px solid var(--gray);border-bottom-width:4px;border-radius:14px;background:var(--bg);padding:12px;font-size:15px;font-weight:700;color:var(--text);min-height:54px}
.mi.sel{border-color:#84d8ff;background:var(--blue-l);color:var(--blue-d)}
.mi.done{border-color:var(--gray);color:var(--gray);background:var(--bg);pointer-events:none;border-bottom-width:2px;margin-top:2px}
.mi.flash{animation:flash .5s}
.mi.good{animation:good .5s}
@keyframes flash{0%,100%{}30%{border-color:var(--red);background:var(--red-l);color:var(--red-d);transform:translateX(-4px)}60%{transform:translateX(4px)}}
@keyframes good{30%{border-color:var(--green);background:var(--green-l);color:var(--green-d)}}
.answer{min-height:64px;border-bottom:2px solid var(--gray);display:flex;flex-wrap:wrap;gap:8px;padding:8px 0;margin-bottom:22px;align-items:center}
.sentence{font-size:18px;line-height:2.4;margin-bottom:22px}
.slot{display:inline-block;min-width:80px;border-bottom:2px solid var(--gray-d);text-align:center;margin:0 4px;padding:0 4px}
.slot.f{border-bottom-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{border:2px solid var(--gray);border-bottom-width:4px;border-radius:12px;background:var(--bg);padding:9px 14px;font-size:16px;font-weight:700;color:var(--text)}
.tok.used{background:var(--gray);color:transparent;border-color:var(--gray);pointer-events:none}
.ordlist{display:flex;flex-direction:column;gap:8px;margin-bottom:20px;min-height:40px}
.ordlist .tok{text-align:left;display:flex;gap:10px}
.ordlist .tok b{color:var(--blue)}
.ordbank{flex-direction:column;align-items:stretch}
.ordbank .tok{text-align:left}
.lfoot{border-top:2px solid var(--gray);padding:22px 20px}
.lfoot .in{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:16px}
.lfoot.ok{background:var(--green-l);border-color:transparent}
.lfoot.bad{background:var(--red-l);border-color:transparent}
.fb{flex:1;display:flex;gap:14px;align-items:flex-start}
.fb .ic{flex:0 0 64px;height:64px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:34px}
.fb h3{margin:2px 0 4px;font-size:22px;font-weight:900}
.lfoot.ok h3{color:var(--green-d)}.lfoot.bad h3{color:var(--red-d)}
.fb .sol{font-size:16px;color:var(--red-d);margin-bottom:4px}
.fb .ex{font-size:14px;color:var(--text);opacity:.85;line-height:1.4;max-height:30vh;overflow:auto}
.lfoot.ok .ex{color:var(--green-d)}
.skip{background:var(--bg);color:var(--gray-d);border:2px solid var(--gray);box-shadow:0 4px 0 var(--gray)}
/* RESULT */
.screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;z-index:20}
.screen h1{font-size:30px;font-weight:900;color:var(--gold-d);margin:14px 0 22px}
.screen h1.f{color:var(--red-d)}
.cards{display:flex;gap:14px;margin-bottom:34px;flex-wrap:wrap;justify-content:center}
.card{width:130px;border-radius:16px;border:2px solid;overflow:hidden}
.card div:first-child{color:#fff;font-size:12px;font-weight:900;text-transform:uppercase;padding:5px}
.card div:last-child{font-size:22px;font-weight:900;padding:14px 4px;background:var(--bg)}
.c1{border-color:var(--gold)}.c1 div:first-child{background:var(--gold)}.c1 div:last-child{color:var(--gold-d)}
.c2{border-color:var(--green)}.c2 div:first-child{background:var(--green)}.c2 div:last-child{color:var(--green-d)}
.c3{border-color:var(--blue)}.c3 div:first-child{background:var(--blue)}.c3 div:last-child{color:var(--blue-d)}
.screen .btn{min-width:260px}
.review{max-width:600px;width:100%;text-align:left;max-height:30vh;overflow:auto;margin-bottom:20px;font-size:14px}
.review div{border-left:4px solid var(--red);padding:6px 10px;margin-bottom:8px;background:#fafafa;border-radius:6px}
.mascot-big{animation:jump 1s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-12px)}}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:560px){.mascot{display:none}.bubble::before{display:none}.bubble{font-size:16px}.fb .ic{display:none}.lfoot .in{flex-direction:column;align-items:stretch}.stats{gap:10px;font-size:15px}}
</style>
</head>
<body>

<div id="home">
  <div class="top">
    <div class="logo">⚡ IHK-Lingo</div>
    <div class="stats">
      <span class="stat-fire" title="Tage-Serie">🔥 <b id="sStreak">0</b></span>
      <span class="stat-xp" title="Gesamt-XP">💎 <b id="sXp">0</b></span>
      <span class="stat-snd" id="sSnd" title="Ton an/aus">🔊</span>
      <span class="theme-btn" id="sTheme" title="Dark Mode (Taste D)" onclick="toggleTheme()">🌙</span>
    </div>
  </div>
  <div class="hero">
    <div class="hero-m" id="heroM"></div>
    <div class="say" id="heroSay">Hallo!</div>
  </div>
  <div class="goal">
    <span style="font-size:30px">🎯</span>
    <div style="flex:1">
      <div style="font-size:14px;margin-bottom:6px">Tagesziel: <span id="gTxt">0 / 50 XP</span></div>
      <div class="bar"><i id="gBar" style="width:0"></i></div>
    </div>
  </div>
  <div class="actions">
    <button class="btn blue" onclick="startExam()">📝 Prüfungs&shy;simulation</button>
    <button class="btn red" id="btnMist" onclick="startMistakes()">💔 Fehler üben</button>
  </div>
  <div id="units"></div>
  <div class="foot">Europa Tabellenbuch Elektrotechnik · IHK AP2 Prüfungsvorbereitung<br>
    Fortschritt wird im Browser gespeichert · <a onclick="resetAll()">Fortschritt zurücksetzen</a></div>
</div>

<div id="lesson" class="hidden">
  <div class="lhead">
    <button class="x" onclick="quitLesson()" title="Beenden">✕</button>
    <div class="prog"><i id="pBar"></i></div>
    <div class="timer hidden" id="lTimer"></div>
    <div class="hearts" id="lHearts">❤️ 5</div>
  </div>
  <div class="lbody"><div class="qwrap" id="qArea"></div></div>
  <div class="lfoot" id="lFoot"><div class="in" id="lFootIn"></div></div>
</div>

<div id="result" class="screen hidden"></div>

<script>
/* ============ FRAGEN-BUILDER ============ */
const M=(q,o,a,e)=>({t:'mc',q,o,a,e});          // Multiple Choice, a = Index der richtigen Antwort
const T=(q,a,e)=>({t:'tf',q,a,e});               // Richtig / Falsch
const N=(q,a,u,e,tol)=>({t:'num',q,a,u,e,tol:tol==null?0.02:tol}); // Rechenaufgabe
const P=(q,p,e)=>({t:'match',q,p,e});            // Paare zuordnen
const F=(q,a,x,e)=>({t:'fill',q,a,x,e});         // Lückentext (a = richtige Wörter, x = Ablenker)
const O=(q,a,e)=>({t:'ord',q,a,e});              // Reihenfolge

const UNITS=[
{id:'gs',name:'Gleichstromtechnik',icon:'🔋',color:'#58cc02',dark:'#58a700',qs:[
N('An einem Widerstand von 46 Ω liegen 230 V. Wie groß ist der Strom?',5,'A','I = U / R = 230 V / 46 Ω = 5 A'),
N('Ein Heizgerät nimmt bei 230 V einen Strom von 10 A auf. Welche Leistung hat es?',2300,'W','P = U · I = 230 V · 10 A = 2300 W'),
N('Kupferleitung, einfache Länge 25 m (Hin- und Rückleiter), A = 1,5 mm², κ = 56 m/(Ω·mm²). Wie groß ist der Leitungswiderstand?',0.595,'Ω','R = 2·l / (κ·A) = 50 m / (56 · 1,5) ≈ 0,595 Ω',0.03),
N('Drei Widerstände 100 Ω, 220 Ω und 680 Ω sind in Reihe geschaltet. Gesamtwiderstand?',1000,'Ω','Reihenschaltung: R = R1 + R2 + R3 = 1000 Ω'),
N('60 Ω und 30 Ω sind parallel geschaltet. Gesamtwiderstand?',20,'Ω','R = (R1·R2)/(R1+R2) = 1800/90 = 20 Ω'),
M('Brückenschaltung: linker Zweig oben 10 kΩ, unten Sensor 50 kΩ. Rechter Zweig oben 1 kΩ, unten Potenziometer Rₓ. Welcher Wert für Rₓ, damit das Messgerät in der Brückendiagonale <em>keine</em> Spannung anzeigt?',['5 kΩ','10 kΩ','50 kΩ','100 kΩ','500 kΩ'],0,'Abgleich: R1/R2 = R3/R4 → 10k/50k = 1k/Rₓ → Rₓ = 5 kΩ (IHK W25/26)'),
N('Ein Gerät mit 2 kW läuft 5 Stunden. Strompreis 0,35 €/kWh. Kosten in €?',3.5,'€','W = P·t = 2 kW · 5 h = 10 kWh → 10 · 0,35 € = 3,50 €'),

function setMood(svg,mood,ms){if(!svg)return;clearTimeout(svg._t);

const TIPS=['Merksatz: Bei Induktivitäten die Ströme sich verspäten. 🌀','5 Sicherheitsregeln: Freischalten, Sichern, Prüfen, Erden, Abdecken. 🦺','Stern-Dreieck-Anlauf: Strom und Moment sinken auf 1/3. ⭐','TN-System 230 V: Abschaltung in 0,4 s – TT: 0,2 s. ⏱️',

function say(t){const s=$('heroSay');if(!s)return;s.classList.remove('type');void s.offsetWidth;s.classList.add('type');s.textContent=t}
function greet(){const h=new Date().getHours(),g=h<11?'Guten Morgen':h<18?'Hallo':'Guten Abend',nm=Object.keys(S.wrong).length;
  if(S.streak>1)return `${g}! 🔥 ${S.streak} Tage Serie – halt sie am Leben!`;

function voltiClick(svg,e){e.stopPropagation();sound('poke');

function hint(svg){if(!R||R.state!=='ask')return;const q=R.q;
  if(q.t==='mc'){const wrong=[...document.querySelectorAll('.opt:not(.elim)')].filter(b=>+b.dataset.i!==q.a);
    if(wrong.length>1&&(R.hints||0)<2){R.hints=(R.hints||0)+1;const b=wrong[Math.random()*wrong.length|0];b.classList.add('elim');b.classList.remove('sel');if(R.sel===+b.dataset.i){R.sel=null;$('chk').disabled=true}
      setMood(svg,'wow',800);return pop(svg,'Die ist es nicht! 👀')}
    setMood(svg,'think',900);return pop(svg,'Mehr verrat ich nicht 🤐')}
  if(q.t==='num'){setMood(svg,'think',1200);const f=(q.e||'').split('→')[0].split('=').slice(0,2).join('=').trim();return pop(svg,f&&f.length<=45?'💡 '+f:'Schau ins Tabellenbuch! 📘')}
  if(q.t==='match'){setMood(svg,'think',900);return pop(svg,'Fang mit dem Sichersten an! 🧩')}
  if(q.t==='ord'||q.t==='fill'){const k=R.bank.findIndex((b,i)=>b.t===q.a[R.pick.length]&&!R.pick.includes(i));
    if(R.pick.every((p,i)=>R.bank[p].t===q.a[i])&&k>=0){tapTok(k);setMood(svg,'happy',700);return pop(svg,'Das kommt als Nächstes! ☝️')}
    setMood(svg,'worried',900);return pop(svg,'Da stimmt schon was nicht… 🤔')}
  setMood(svg,'think',900);pop(svg,'Lies genau! 🔍')}

/* ============ HOME ============ */
function renderHome(){
  if(S.day!==today()){S.day=today();S.dayXp=0;save()}
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(S.last&&S.last!==today()&&S.last!==y&&S.streak){S.streak=0;save()}
  $('heroM').innerHTML=mascot(96,'idle','heroV');say(greet());wake();
  $('sStreak').textContent=S.streak;$('sXp').textContent=S.xp;$('sSnd').textContent=S.sound?'🔊':'🔇';
  $('gTxt').textContent=Math.min(S.dayXp,50)+' / 50 XP';$('gBar').style.width=Math.min(100,S.dayXp*2)+'%';
  const nm=Object.keys(S.wrong).length;$('btnMist').textContent='💔 Fehler üben ('+nm+')';$('btnMist').disabled=!nm;
  let html='',nextFound=false;
  const offs=[0,60,90,60,0,-60,-90,-60];let k=0;
  UNITS.forEach((u,ui)=>{
    const d=S.done[u.id]||0;
    html+=`<div class="unit-head" style="background:${u.color}"><span class="cnt">${u.qs.length} Fragen</span><small>Einheit ${ui+1}</small><b>${u.icon} ${u.name}</b></div><div class="path">`;
    NODES.forEach((n,ni)=>{
      const isDone=ni<d, isNext=!nextFound&&ni===d;if(isNext)nextFound=true;
      const ic=ni===3?'🏆':isDone?'⭐':u.icon;
      html+=`<button class="node ${isDone?'done':''} ${isNext?'next':''} ${!isDone&&!isNext&&ni>d?'locked':''}" style="background:${u.color};box-shadow:0 7px 0 ${u.dark};transform:translateX(${offs[k++%8]}px)" onclick="startUnit(${ui},${ni})">${ic}<span class="lbl">${n}</span></button>`});
    html+='</div>'});
  $('units').innerHTML=html;
}
function resetAll(){if(confirm('Wirklich den gesamten Fortschritt löschen?')){localStorage.removeItem(KEY);load();renderHome()}}

/* ============ LEKTION ============ */
let L=null,R=null;
function pick(pool,n){ // bevorzugt falsch beantwortete und ungesehene Fragen
  return shuffle(pool).map(q=>({q,w:(S.wrong[q.id]||0)*3+(S.seen[q.id]?0:2)+Math.random()*2})).sort((a,b)=>b.w-a.w).slice(0,n).map(x=>x.q)}
function startUnit(ui,ni){const u=UNITS[ui];const qs=ni===3?shuffle(u.qs).slice(0,15):pick(u.qs,8);
  begin({qs:shuffle(qs),mode:'unit',unit:u,node:ni,hearts:5})}
function startExam(){begin({qs:shuffle(ALLQ).slice(0,30),mode:'exam',hearts:null})}
function startMistakes(){const pool=ALLQ.filter(q=>S.wrong[q.id]);if(!pool.length)return;begin({qs:pick(pool,10),mode:'mist',hearts:5})}
function begin(o){L=Object.assign({queue:o.qs.slice(),total:o.qs.length,solved:0,correct:0,firstWrong:new Set(),t0:Date.now(),reviewed:[]},o);
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('lesson').classList.remove('hidden');
  $('lHearts').classList.toggle('hidden',L.hearts==null);$('lTimer').classList.toggle('hidden',L.mode!=='exam');
  clearInterval(L.tick);if(L.mode==='exam'){L.tick=setInterval(()=>{const s=(Date.now()-L.t0)/1000|0;$('lTimer').textContent='⏱ '+(s/60|0)+':'+String(s%60).padStart(2,'0')},500)}
  next()}
function quitLesson(){if(L&&L.solved>0&&!confirm('Lektion wirklich abbrechen? Dein Fortschritt geht verloren.'))return;clearInterval(L&&L.tick);L=null;$('lesson').classList.add('hidden');$('home').classList.remove('hidden');renderHome()}
function updHead(){$('pBar').style.width=(L.solved/L.total*100)+'%';if(L.hearts!=null)$('lHearts').textContent='❤️ '+L.hearts}

const TYPELBL={mc:'Wähle die richtige Antwort',tf:'Richtig oder falsch?',num:'Berechne',match:'Ordne die Paare zu',fill:'Vervollständige den Satz',ord:'Bringe in die richtige Reihenfolge'};
function next(){updHead();if(!L.queue.length)return finish();
  const q=L.queue.shift();R={q,sel:null,state:'ask'};
  const A=$('qArea');
  let h=`<div class="qtype">${TYPELBL[q.t]} <span class="tag">${q.unit.icon} ${esc(q.unit.name)}</span>${L.firstWrong.has(q.id)?'<span class="tag" style="background:#ffdfe0;color:#ea2b2b">Wiederholung</span>':''}</div>`;
  h+=`<div class="qrow"><div class="mascot">${mascot(70,L.hearts===1?'worried':'idle','lessonV')}<div class="hint-lbl">Tipp? Klick!</div></div><div class="bubble">${q.q}</div></div>`;
  if(q.t==='mc'){R.order=shuffle(q.o.map((_,i)=>i));
    h+='<div class="opts">'+R.order.map((oi,i)=>`<button class="opt" data-i="${oi}" onclick="selOpt(this)"><span class="k">${i+1}</span><span>${esc(q.o[oi])}</span></button>`).join('')+'</div>'}
  else if(q.t==='tf'){h+='<div class="tfrow"><button class="opt" data-i="1" onclick="selOpt(this)">✔️ Richtig</button><button class="opt" data-i="0" onclick="selOpt(this)">❌ Falsch</button></div>'}
  else if(q.t==='num'){h+=`<div class="numrow"><input id="numIn" inputmode="decimal" autocomplete="off" placeholder="Ergebnis"><span class="u">${esc(q.u||'')}</span></div><div class="hint">Komma oder Punkt erlaubt · Toleranz ±${Math.max(q.tol*100,0).toFixed(0)} %</div>`}
  else if(q.t==='match'){R.done=0;R.mist=0;R.L=null;R.Ri=null;const ls=shuffle(q.p.map((_,i)=>i)),rs=shuffle(q.p.map((_,i)=>i));
    h+='<div class="match"><div class="col">'+ls.map(i=>`<button class="mi" data-s="L" data-i="${i}" onclick="selMatch(this)">${esc(q.p[i][0])}</button>`).join('')+'</div><div class="col">'+rs.map(i=>`<button class="mi" data-s="R" data-i="${i}" onclick="selMatch(this)">${esc(q.p[i][1])}</button>`).join('')+'</div></div>'}
  else if(q.t==='fill'||q.t==='ord'){R.bank=shuffle(q.a.concat(q.x||[]).map((t,i)=>({t,i})));R.pick=[];
    h+=`<div id="ansArea"></div><div class="bank ${q.t==='ord'?'ordbank':''}" id="bank"></div>`}
  A.innerHTML=h;
  if(q.t==='fill'||q.t==='ord')drawBank();
  setFoot('ask');
  if(q.t==='num'){const inp=$('numIn');inp.focus();inp.oninput=()=>{$('chk').disabled=!inp.value.trim()}}
  $('qArea').parentElement.scrollTop=0;
}
function setFoot(st,ok){const f=$('lFoot'),fi=$('lFootIn');f.className='lfoot';
  if(st==='ask'){fi.innerHTML=`<button class="btn skip" onclick="skipQ()">Überspringen</button><button class="btn" id="chk" onclick="check()" disabled>Überprüfen</button>`}
  else{const q=R.q;f.classList.add(ok?'ok':'bad');
    const praise=['Hervorragend!','Super!','Richtig!','Klasse!','Genau so!','Stark!'][Math.random()*6|0];
    fi.innerHTML=`<div class="fb"><div class="ic">${mascot(52,ok?'happy':'sad')}</div><div><h3>${ok?praise:'Leider falsch'}</h3>${ok?'':`<div class="sol"><b>Richtige Lösung:</b> ${esc(solution(q))}</div>`}<div class="ex">💡 ${esc(q.e||'')}</div></div></div><button class="btn ${ok?'':'red'}" id="chk" onclick="cont()">Weiter</button>`}}
function solution(q){switch(q.t){case 'mc':return q.o[q.a];case 'tf':return q.a?'Richtig':'Falsch';
  case 'num':return fmt(q.a)+' '+(q.u||'');case 'match':return q.p.map(p=>p[0]+' → '+p[1]).join(' · ');
  case 'fill':{let i=0;return q.q.replace(/<[^>]+>/g,'').replace(/___/g,()=>q.a[i++])}case 'ord':return q.a.map((t,i)=>(i+1)+'. '+t).join('  ')}}
function selOpt(b){if(R.state!=='ask')return;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');R.sel=+b.dataset.i;$('chk').disabled=false;
  const v=$('lessonV');if(v&&!v.classList.contains('think'))setMood(v,'think',1400)}
function selMatch(b){if(R.state!=='ask')return;const s=b.dataset.s;
  document.querySelectorAll(`.mi[data-s="${s}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');R[s==='L'?'L':'Ri']=b;
  if(R.L&&R.Ri){const a=R.L,c=R.Ri;R.L=R.Ri=null;
    if(a.dataset.i===c.dataset.i){[a,c].forEach(x=>{x.classList.remove('sel');x.classList.add('good');setTimeout(()=>x.classList.add('done'),350)});R.done++;sound(true);setMood($('lessonV'),'happy',600);
      if(R.done===R.q.p.length)$('chk').disabled=false}
    else{R.mist++;sound(false);setMood($('lessonV'),'worried',700);[a,c].forEach(x=>{x.classList.remove('sel');x.classList.remove('flash');void x.offsetWidth;x.classList.add('flash')})}}}
function drawBank(){const q=R.q,used=new Set(R.pick);
  $('bank').innerHTML=R.bank.map((b,k)=>`<button class="tok ${used.has(k)?'used':''}" onclick="tapTok(${k})">${esc(b.t)}</button>`).join('');
  if(q.t==='fill'){let n=0;$('ansArea').innerHTML='<div class="sentence">'+q.q.split('___').map((part,i,arr)=>part+(i<arr.length-1?(()=>{const k=R.pick[n++];return k!=null?`<button class="tok" onclick="untap(${n-1})">${esc(R.bank[k].t)}</button>`:'<span class="slot">&nbsp;</span>'})():'')).join('')+'</div>'}
  else $('ansArea').innerHTML='<div class="ordlist">'+(R.pick.length?R.pick.map((k,i)=>`<button class="tok" onclick="untap(${i})"><b>${i+1}.</b> ${esc(R.bank[k].t)}</button>`).join(''):'<div class="hint">Tippe die Schritte unten in der richtigen Reihenfolge an.</div>')+'</div>';
  const ch=$('chk');if(ch)ch.disabled=R.pick.length!==q.a.length}
function tapTok(k){if(R.state!=='ask'||R.pick.length>=R.q.a.length)return;R.pick.push(k);drawBank()}
function untap(i){if(R.state!=='ask')return;R.pick.splice(i,1);drawBank()}
function evaluate(){const q=R.q;
  switch(q.t){case 'mc':return R.sel===q.a;case 'tf':return (R.sel===1)===q.a;
  case 'num':{const v=parseFloat($('numIn').value.replace(/\s/g,'').replace(',','.'));if(isNaN(v))return false;
    return q.tol===0?Math.abs(v-q.a)<1e-9:Math.abs(v-q.a)<=Math.abs(q.a)*q.tol+1e-9}
  case 'match':return R.mist===0;
  case 'fill':case 'ord':return R.pick.map(k=>R.bank[k].t).join('|')===q.a.join('|')}}
function skipQ(){if(R.state!=='ask')return;check(true)}
function check(skipped){if(R.state!=='ask')return;const ch=$('chk');if(!skipped&&ch&&ch.disabled)return;
  const q=R.q,ok=!skipped&&evaluate();R.state='done';
  if(q.t==='mc'||q.t==='tf'){document.querySelectorAll('.opt').forEach(b=>{const i=+b.dataset.i;
    const right=q.t==='mc'?i===q.a:(i===1)===q.a;if(right)b.classList.add('ok');else if(b.classList.contains('sel'))b.classList.add('bad')})}
  if(q.t==='num'){const inp=$('numIn');inp.disabled=true;inp.style.borderColor=ok?'var(--green)':'var(--red)'}
  S.seen[q.id]=(S.seen[q.id]||0)+1;
  if(ok){L.solved++;if(!L.firstWrong.has(q.id))L.correct++;
    if(L.mode==='mist'){S.wrong[q.id]=(S.wrong[q.id]||1)-1;if(S.wrong[q.id]<=0)delete S.wrong[q.id]}
    sound(true);L.combo=(L.combo||0)+1;const v=$('lessonV');
    if(L.combo>=3&&L.combo%1===0&&[3,5,8,10,15,20].includes(L.combo)){setMood(v,'excited');pop(v,L.combo+'er-Combo! 🔥')}
    else{setMood(v,'happy');pop(v,['+1 ⚡','Yes! 🎉','Stark! 💪','Nice! ✨'][Math.random()*4|0])}}
  else{L.combo=0;const v=$('lessonV');setMood(v,'sad');pop(v,L.hearts===2?'Nur noch 1 Herz! 😰':['Ohh nein… 😢','Nicht schlimm! 🫶','Gleich nochmal! 💪'][Math.random()*3|0]);S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    if(!L.firstWrong.has(q.id))L.reviewed.push(q);L.firstWrong.add(q.id);
    if(L.hearts!=null){L.hearts--;$('lHearts').classList.remove('shake');void $('lHearts').offsetWidth;$('lHearts').classList.add('shake')}
    if(L.mode==='exam')L.solved++;else L.queue.push(q);
    sound(false)}
  save();updHead();setFoot('done',ok)}
function cont(){if(L.hearts!=null&&L.hearts<=0)return fail();next()}
document.addEventListener('keydown',e=>{if(!L||$('lesson').classList.contains('hidden'))return;
  if(e.key==='Enter'){e.preventDefault();if(R.state==='ask')check();else cont();return}
  if(R.state==='ask'&&(R.q.t==='mc'||R.q.t==='tf')&&/^[1-9]$/.test(e.key)){const b=document.querySelectorAll('.opt')[+e.key-1];if(b)selOpt(b)}});

/* ============ ERGEBNIS ============ */
function addXp(n){S.xp+=n;if(S.day!==today()){S.day=today();S.dayXp=0}S.dayXp+=n;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(S.last!==today()){S.streak=S.last===y?S.streak+1:1;S.last=today()}save()}
function note(p){return p>=92?'1 – sehr gut':p>=81?'2 – gut':p>=67?'3 – befriedigend':p>=50?'4 – ausreichend':p>=30?'5 – mangelhaft':'6 – ungenügend'}
function finish(){clearInterval(L.tick);updHead();
  const acc=Math.round(L.correct/L.total*100),sec=(Date.now()-L.t0)/1000|0,time=(sec/60|0)+':'+String(sec%60).padStart(2,'0');
  let xp,title,extra='';
  if(L.mode==='exam'){xp=L.correct*2;title=acc>=50?'Prüfung bestanden!':'Nicht bestanden – weiter üben!';
    extra=`<div style="font-size:20px;margin-bottom:20px">IHK-Note: <b>${note(acc)}</b></div>`;
    if(L.reviewed.length)extra+='<div class="review">'+L.reviewed.map(q=>`<div><b>${q.q.replace(/<[^>]+>/g,'')}</b><br>✔ ${esc(solution(q))}</div>`).join('')+'</div>'}
  else{xp=10+L.correct+(L.firstWrong.size===0?5:0);title=L.firstWrong.size===0?'Perfekte Lektion!':'Lektion geschafft!';
    if(L.mode==='unit'){const d=S.done[L.unit.id]||0;if(L.node>=d)S.done[L.unit.id]=L.node+1}}
  addXp(xp);sound('win');
  $('lesson').classList.add('hidden');const r=$('result');r.classList.remove('hidden');
  r.innerHTML=`<div class="mascot-big">${mascot(130,L.mode==='exam'&&acc<50?'worried':'excited','resV')}</div><h1 ${L.mode==='exam'&&acc<50?'class="f"':''}>${title}</h1>${extra}
   <div class="cards"><div class="card c1"><div>XP gesamt</div><div>⚡ ${xp}</div></div><div class="card c2"><div>${L.mode==='exam'?'Ergebnis':'Genauigkeit'}</div><div>🎯 ${acc}%</div></div><div class="card c3"><div>Zeit</div><div>⏱ ${time}</div></div></div>
   <button class="btn" onclick="backHome()">Weiter</button>`;L=null}
function fail(){clearInterval(L.tick);sound(false);const last=L;L=null;
  $('lesson').classList.add('hidden');const r=$('result');r.classList.remove('hidden');
  r.innerHTML=`<div>${mascot(130,'sad')}</div><h1 class="f">Keine Herzen mehr!</h1><p style="color:var(--muted);max-width:420px;margin:-8px 0 30px">Kein Problem – Fehler sind zum Lernen da. Deine falschen Antworten landen in „Fehler üben“.</p>
   <button class="btn blue" style="margin-bottom:14px" id="retry">Nochmal versuchen</button><button class="btn ghost" onclick="backHome()">Zur Übersicht</button>`;
  $('retry').onclick=()=>{if(last.mode==='unit')startUnit(UNITS.indexOf(last.unit),last.node);else startMistakes()}}
function backHome(){$('result').classList.add('hidden');$('home').classList.remove('hidden');renderHome();window.scrollTo(0,0)}

applyTheme();
renderHome();
</script>
</body>
</html>
